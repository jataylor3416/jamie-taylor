<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jamie Taylor</title>
<meta name="description" content="Jamie Taylor, CEO of atLocal Media. Save my contact.">
<meta name="theme-color" content="#21134f">
<meta property="og:title" content="Jamie Taylor | CEO, atLocal Media">
<meta property="og:description" content="Save my contact.">
<link rel="icon" href="atlocal-pin-dark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --plum: #21134f;
    --royal: #3b20ab;
    --coral: #ff7d80;
    --ruby: #e14565;
    --cloud: #f4f1fb;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--plum);
    color: var(--white);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .page { min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: auto minmax(220px, 1fr) auto; }
  header { display: flex; justify-content: center; padding: max(28px, env(safe-area-inset-top)) 16px 0; }
  .scene { position: relative; overflow: hidden; }
  .scene img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 45% 60%; display: block;
    -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent); mask-image: linear-gradient(to bottom, #000 78%, transparent);
    animation: drift 40s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: scale(1.04); } to { transform: scale(1.14) translateX(-3%); } }


  main {
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 16px max(28px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .card { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
  .logo { width: 140px; height: auto; display: block; }
  h1 { font-weight: 800; font-size: clamp(34px, 10vw, 42px); line-height: 1.05; letter-spacing: -.01em; }
  .role { margin-top: 8px; font-size: 15px; font-weight: 600; color: var(--coral); }
  .actions { width: 100%; display: grid; gap: 10px; margin-top: 20px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .row .btn { flex-direction: column; gap: 6px; min-height: 66px; padding: 0 4px; border-radius: 18px; font-size: 13px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 54px; padding: 0 18px; border-radius: 999px;
    font: 600 15px/1 "Plus Jakarta Sans", system-ui, sans-serif; text-decoration: none;
    cursor: pointer; border: 2px solid var(--royal); background: var(--plum); color: var(--white);
    transition: border-color .2s, transform .1s;
  }
  .btn:hover { border-color: var(--coral); }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--ruby); border-color: var(--ruby); }
  .btn.primary:hover { border-color: var(--coral); }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .email { margin-top: 16px; font-size: 14px; font-weight: 500; color: var(--cloud); text-decoration: none; }
  .email:hover { color: var(--coral); }
  @media (prefers-reduced-motion: reduce) { .scene img { animation: none; } }
</style>
</head>
<body>
  <div class="page">
  <header><img class="logo" src="atlocal-logo-dark.svg" alt="atLocal"></header>
  <div class="scene">
    <img src="skyline.jpg" alt="Little Rock skyline and Junction Bridge at sunset">
  </div>

  <main>
    <div class="card">
      <h1>Jamie Taylor</h1>
      <div class="role">CEO, atLocal Media</div>

      <div class="actions">
        <a class="btn primary" href="jamie-taylor.vcf" download="Jamie Taylor.vcf">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
          Save Contact
        </a>
        <div class="row">
          <a class="btn" href="tel:+15015166312">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
            Call
          </a>
          <a class="btn" href="sms:+15015166312">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Text
          </a>
          <a class="btn" href="mailto:jamie@atlocal.com">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
            Email
          </a>
          <button class="btn" id="share" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
            <span id="shareLabel">Share</span>
          </button>
        </div>
      </div>

      <a class="email" href="tel:+15015166312">501-516-6312</a>
      <a class="email" style="margin-top:6px" href="mailto:jamie@atlocal.com">jamie@atlocal.com</a>
    </div>
  </main>
  </div>

<script>
  // Share
  document.getElementById("share").addEventListener("click", async () => {
    const data = { title: "Jamie Taylor", text: "Jamie Taylor, CEO, atLocal Media", url: location.href };
    if (navigator.share) { try { await navigator.share(data); } catch (_) {} return; }
    try {
      await navigator.clipboard.writeText(location.href);
      const l = document.getElementById("shareLabel"); l.textContent = "Link copied";
      setTimeout(() => l.textContent = "Share", 2000);
    } catch (_) {}
  });
</script>
</body>
</html>
