<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jamie Taylor</title>
<meta name="description" content="Jamie Taylor, CEO of atLocal Media. Save my contact.">
<meta name="theme-color" content="#21134f">
<meta property="og:title" content="Jamie Taylor | CEO, atLocal Media">
<meta property="og:description" content="Save my contact.">
<link rel="icon" href="atlocal-pin-dark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --plum: #21134f;
    --royal: #3b20ab;
    --coral: #ff7d80;
    --ruby: #e14565;
    --cloud: #f4f1fb;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--plum);
    color: var(--white);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .page { min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: auto minmax(220px, 1fr) auto; }
  header { display: flex; justify-content: center; padding: max(28px, env(safe-area-inset-top)) 16px 0; }
  .scene { position: relative; overflow: hidden; }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .star { animation: twinkle var(--d) ease-in-out var(--o) infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
  .win { animation: flicker var(--d) steps(1) var(--o) infinite; }
  @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .shimmer { animation: drift var(--d) linear var(--o) infinite; }
  @keyframes drift { 0% { transform: translateX(-40px); opacity: 0; } 30%, 70% { opacity: 1; } 100% { transform: translateX(40px); opacity: 0; } }
  .sun { animation: rise 2.4s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes rise { from { transform: translateY(80px); } to { transform: none; } }

  main {
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 16px max(28px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .card { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
  .logo { width: 140px; height: auto; display: block; }
  h1 { font-weight: 800; font-size: clamp(34px, 10vw, 42px); line-height: 1.05; letter-spacing: -.01em; }
  .role { margin-top: 8px; font-size: 15px; font-weight: 600; color: var(--coral); }
  .actions { width: 100%; display: grid; gap: 10px; margin-top: 20px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .row .btn { flex-direction: column; gap: 6px; min-height: 66px; padding: 0 4px; border-radius: 18px; font-size: 13px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 54px; padding: 0 18px; border-radius: 999px;
    font: 600 15px/1 "Plus Jakarta Sans", system-ui, sans-serif; text-decoration: none;
    cursor: pointer; border: 2px solid var(--royal); background: var(--plum); color: var(--white);
    transition: border-color .2s, transform .1s;
  }
  .btn:hover { border-color: var(--coral); }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--ruby); border-color: var(--ruby); }
  .btn.primary:hover { border-color: var(--coral); }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .email { margin-top: 16px; font-size: 14px; font-weight: 500; color: var(--cloud); text-decoration: none; }
  .email:hover { color: var(--coral); }
  @media (prefers-reduced-motion: reduce) { .star, .win, .shimmer, .sun { animation: none; } }
</style>
</head>
<body>
  <div class="page">
  <header><img class="logo" src="atlocal-logo-dark.svg" alt="atLocal"></header>
  <div class="scene" aria-hidden="true">
    <svg id="scene" viewBox="290 40 620 510" preserveAspectRatio="xMidYMax slice">
      <rect width="1200" height="900" fill="#21134f"/>
      <g id="stars"></g>
      <clipPath id="above"><rect width="1200" height="400"/></clipPath>
      <g clip-path="url(#above)"><circle class="sun" cx="800" cy="400" r="105" fill="#e14565"/></g>
      <g id="sunref" fill="#e14565"></g>
      <g id="skyline"></g>
      <g id="reflect" fill="#3b20ab"></g>
      <rect x="0" y="399" width="1200" height="2" fill="#3b20ab"/>
      <g id="bridge" fill="none" stroke="#ff7d80"></g>
      <g id="shimmer" fill="#ff7d80"></g>
    </svg>
  </div>

  <main>
    <div class="card">
      <h1>Jamie Taylor</h1>
      <div class="role">CEO, atLocal Media</div>

      <div class="actions">
        <a class="btn primary" href="jamie-taylor.vcf" download="Jamie Taylor.vcf">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
          Save Contact
        </a>
        <div class="row">
          <a class="btn" href="tel:+15015166312">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
            Call
          </a>
          <a class="btn" href="sms:+15015166312">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Text
          </a>
          <a class="btn" href="mailto:jamie@atlocal.com">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
            Email
          </a>
          <button class="btn" id="share" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
            <span id="shareLabel">Share</span>
          </button>
        </div>
      </div>

      <a class="email" href="tel:+15015166312">501-516-6312</a>
      <a class="email" style="margin-top:6px" href="mailto:jamie@atlocal.com">jamie@atlocal.com</a>
    </div>
  </main>
  </div>

<script>
  // Little Rock skyline at dusk, drawn in flat atLocal brand colours.
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const H = 400; // horizon

  // Stars
  const stars = document.getElementById("stars");
  for (let i = 0; i < 70; i++) {
    const s = el("circle", { cx: rand() * 1200, cy: 40 + rand() * 300, r: 0.8 + rand() * 1.4, fill: "#f4f1fb", class: "star" }, stars);
    s.style.setProperty("--d", (2 + rand() * 4).toFixed(1) + "s");
    s.style.setProperty("--o", (-rand() * 5).toFixed(1) + "s");
  }

  // Sun reflection stripes
  const sunref = document.getElementById("sunref");
  [[8, 170], [18, 130], [30, 90], [44, 50]].forEach(([dy, w]) => el("rect", { x: 800 - w / 2, y: H + dy, width: w, height: 4 }, sunref));

  // Buildings: [x, width, height, top]
  const B = [
    [250, 36, 60], [290, 40, 85], [334, 30, 120], [368, 34, 70],
    [405, 42, 110], [450, 40, 170, "flat"], [494, 52, 230, "step"], [550, 48, 300, "crown"],
    [602, 46, 240, "slant"], [652, 44, 185, "flat"], [700, 38, 120], [742, 34, 70], [780, 40, 85],
    [824, 30, 60], [858, 44, 45]
  ];
  const sky = document.getElementById("skyline");
  const refl = document.getElementById("reflect");
  B.forEach(([x, w, h, top]) => {
    const y = H - h;
    let d = `M${x} ${H}V${y}H${x + w}V${H}Z`;
    if (top === "step") d = `M${x} ${H}V${y + 16}H${x + 8}V${y + 8}H${x + 16}V${y}H${x + w - 16}V${y + 8}H${x + w - 8}V${y + 16}H${x + w}V${H}Z`;
    if (top === "crown") d = `M${x} ${H}V${y}H${x + 8}V${y - 14}H${x + w - 8}V${y}H${x + w}V${H}Z M${x + w / 2 - 1.5} ${y - 14}h3v-26h-3z`;
    if (top === "slant") d = `M${x} ${H}V${y + 18}L${x + w} ${y}V${H}Z`;
    el("path", { d, fill: "#3b20ab" }, sky);

    // Windows
    for (let wy = y + 22; wy < H - 10; wy += 12) {
      for (let wx = x + 6; wx < x + w - 6; wx += 9) {
        if (rand() < 0.28) {
          const win = el("rect", { x: wx, y: wy, width: 4, height: 6, fill: rand() < 0.75 ? "#ff7d80" : "#f4f1fb" }, sky);
          if (rand() < 0.18) {
            win.setAttribute("class", "win");
            win.style.setProperty("--d", (4 + rand() * 8).toFixed(1) + "s");
            win.style.setProperty("--o", (-rand() * 8).toFixed(1) + "s");
          }
        }
      }
    }
    // Broken reflection stripes on the river
    for (let ry = H + 6, i = 0; ry < H + Math.min(h * 0.5, 90); ry += 7, i++) {
      const inset = (i % 2) * 4 + rand() * 4;
      el("rect", { x: x + inset, y: ry, width: Math.max(4, w - inset * 2), height: 3 }, refl);
    }
  });

  // Clinton Presidential Center, cantilevered over the river bank
  el("path", { d: `M890 ${H}V${H - 18}H880V${H - 34}H1030V${H - 18}H905V${H}Z`, fill: "#3b20ab" }, sky);
  for (let wx = 886; wx < 1024; wx += 8) el("rect", { x: wx, y: H - 29, width: 5, height: 6, fill: "#ff7d80" }, sky);

  // Broadway Bridge: twin arches with hangers
  const br = document.getElementById("bridge");
  const deck = H + 50;
  el("line", { x1: 180, y1: deck, x2: 1020, y2: deck, "stroke-width": 3 }, br);
  [[260, 590], [610, 940]].forEach(([a, b]) => {
    const mid = (a + b) / 2, peak = deck - 70;
    el("path", { d: `M${a} ${deck}Q${mid} ${peak * 2 - deck + 0} ${b} ${deck}`, "stroke-width": 3 }, br);
    for (let hx = a + 22; hx < b - 10; hx += 22) {
      const t = (hx - a) / (b - a);
      const ay = (1 - t) * (1 - t) * deck + 2 * (1 - t) * t * (peak * 2 - deck) + t * t * deck;
      el("line", { x1: hx, y1: ay, x2: hx, y2: deck, "stroke-width": 1 }, br);
    }
  });

  // River shimmer
  const sh = document.getElementById("shimmer");
  for (let i = 0; i < 26; i++) {
    const r = el("rect", { x: 200 + rand() * 800, y: H + 8 + rand() * 120, width: 10 + rand() * 26, height: 2, class: "shimmer" }, sh);
    r.style.setProperty("--d", (4 + rand() * 5).toFixed(1) + "s");
    r.style.setProperty("--o", (-rand() * 8).toFixed(1) + "s");
  }

  // Share
  document.getElementById("share").addEventListener("click", async () => {
    const data = { title: "Jamie Taylor", text: "Jamie Taylor, CEO, atLocal Media", url: location.href };
    if (navigator.share) { try { await navigator.share(data); } catch (_) {} return; }
    try {
      await navigator.clipboard.writeText(location.href);
      const l = document.getElementById("shareLabel"); l.textContent = "Link copied";
      setTimeout(() => l.textContent = "Share", 2000);
    } catch (_) {}
  });
</script>
</body>
</html>
